# Wyświetlacz - włączamy ZMK_DISPLAY (działa zarówno z OLED jak i nice!view)
CONFIG_ZMK_DISPLAY=y

# Enkodery - oba (lewy i prawy)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Nazwa klawiatury
CONFIG_ZMK_KEYBOARD_NAME="Sofle FT"

# BT moc
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ZMK Studio (shield sofle ma już feature 'studio' w upstream)
CONFIG_ZMK_STUDIO=y

# Eager debouncing (jak w innych klawiaturach FT)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
CONFIG_ZMK_USB_LOGGING=n
